name: Deploy Next.js to DirectAdmin

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_APP_URL: https://holidaybankexpeditions.com
          NEXT_PUBLIC_API_URL: https://api.holidaybankexpeditions.com
          API_INTERNAL_URL: https://api.holidaybankexpeditions.com
        run: npm run build

      - name: Deploy Files to Server via SSH
        uses: appleboy/rsync-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: ".next, public, app.js, next.config.js, package.json"
          target: "/home/holiday2/holidaybank-web"
          delete: false

      - name: Restart Passenger App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/holiday2/holidaybank-web
            mkdir -p tmp && touch tmp/restart.txt
name: Deploy Next.js to DirectAdmin

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_APP_URL: https://holidaybankexpeditions.com
          NEXT_PUBLIC_API_URL: https://api.holidaybankexpeditions.com
          API_INTERNAL_URL: https://api.holidaybankexpeditions.com
        run: npm run build

      - name: Package Build Artifacts
        run: tar -czf deploy.tar.gz .next public app.js next.config.js package.json

      - name: Copy and Extract via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/holiday2/holidaybank-web
            mkdir -p staging_deploy

      - name: Upload Tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/holiday2/holidaybank-web/staging_deploy"

      - name: Extract and Restart Passenger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/holiday2/holidaybank-web
            tar -xzf staging_deploy/deploy.tar.gz -C .
            rm -rf staging_deploy
            mkdir -p tmp && touch tmp/restart.txt